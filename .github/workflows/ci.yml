name: CI - Metrics Unit Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest flask prometheus_client
      - run: python -m pytest -v test_metrics/test_metrics.py
